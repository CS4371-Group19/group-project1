services:
  producer:
    build: .
    env_file:
      - .env
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092
      ARTICLE_TOPIC: topic1
      PYTHONUNBUFFERED: "1"
    working_dir: /app/state
    entrypoint: ["python3"]
    command: ["/app/scripts/news_producer.py"]
    volumes:
      - producer-state:/app/state
    depends_on:
      - kafka

  spark:
    build: .
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092
      ARTICLE_TOPIC: topic1
      ENTITY_COUNT_TOPIC: topic2
      CLASSIFICATION_COUNT_TOPIC: topic3
    working_dir: /app
    entrypoint: ["/opt/spark/bin/spark-submit"]
    command:
      - --master
      - "local[*]"
      - --packages
      - org.apache.spark:spark-sql-kafka-0-10_2.13:4.0.1
      - --conf
      - spark.jars.ivy=/tmp/spark-ivy
      - --conf
      - spark.sql.shuffle.partitions=4
      - /app/scripts/entity_stream.py
    volumes:
      - spark-checkpoints:/app/checkpoints
    depends_on:
      - kafka

volumes:
  producer-state:
  spark-checkpoints: