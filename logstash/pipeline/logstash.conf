input {
  kafka {
    bootstrap_servers => "kafka:19092"
    topics => ["topic2"]
    group_id => "entity-visualization"
    auto_offset_reset => "earliest"
    codec => json
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "entity-counts"
    document_id => "%{entity}"
    action => "index"
    ilm_enabled => false
    data_stream => false
  }
}